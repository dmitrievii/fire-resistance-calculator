jobs:
  streamlit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Streamlit presentation layers
        run: >-
          python -m py_compile
          streamlit_app.py
          streamlit_app_core.py
          streamlit_guided_ux.py
          streamlit_guided_ux_v071.py
          streamlit_guided_ux_v072.py
          streamlit_guided_ux_v073.py
          streamlit_guided_ux_v074.py
          streamlit_guided_ux_v075.py
          streamlit_guided_ux_v076.py
          streamlit_guided_ux_v077.py
          streamlit_guided_ux_v078.py
          streamlit_guided_ux_v079.py
          streamlit_guided_ux_v080.py
          streamlit_guided_ux_v081.py
          streamlit_guided_ux_v082.py
          streamlit_guided_ux_v083.py
          streamlit_guided_ux_v084.py
          streamlit_graphic_selectors.py
          streamlit_graphic_selectors_v072.py
          streamlit_graphic_selectors_v079.py
          streamlit_mobile_ux.py
          streamlit_navigation.py
          streamlit_report_ui.py
          streamlit_report_ui_impl.py
          streamlit_report_summary.py
          standard_core/sp16_mech7_v072_remediation.py
          standard_core/sp16_mech7_v073_session_remediation.py
          standard_core/sp16_mech7_v074_physical_remediation.py
          standard_core/sp16_mech7_v075_graph_overlay.py
          standard_core/sp16_mech7_v075_zy_runtime.py
          standard_core/sp16_mech7_v076_graph_overlay.py
          standard_core/sp16_mech7_v076_runtime.py
          standard_core/sp16_mech7_v078_gamma_c.py
          standard_core/sp16_mech7_v078_graph_overlay.py
          standard_core/sp16_mech7_v079_guided_route_overlay.py
          standard_core/sp16_mech7_v080_guided_cleanup_overlay.py
          standard_core/sp16_mech7_v081_end_to_end_overlay.py
          standard_core/sp16_mech7_v081_runtime.py
          standard_core/sp16_mech7_v082_guided_route_overlay.py
          standard_core/sp16_mech7_v082_runtime.py
          standard_core/sp16_mech7_v083_full_route_overlay.py
          standard_core/sp16_mech7_v083_runtime.py
          standard_core/sp16_mech7_v084_thermal_visual_overlay.py
          standard_core/sp16_mech7_v084_thermal_visual_runtime.py
          standard_core/report_ir.py
          standard_core/report_ir2.py
          standard_core/report_ir4.py
          standard_core/report_ir5.py
          standard_core/report_equations.py
          standard_core/report_markdown.py
          standard_core/report_markdown_impl.py
          standard_core/report_readiness.py
          standard_core/report_metadata.py
      - name: Streamlit UI smoke
        run: python -m pytest -q tests/test_streamlit_ui.py
      - name: Guided UX regression
        run: python -m pytest -q tests/test_streamlit_guided_ux.py
      - name: Mobile UX regression
        run: python -m pytest -q tests/test_streamlit_mobile_ux.py
      - name: Navigation regression
        run: python -m pytest -q tests/test_streamlit_navigation.py
      - name: Report golden regression
        run: python -m pytest -q tests/test_report_tension_golden.py
      - name: v0.73 existing-session regression
        run: python -m pytest -q tests/test_v073_existing_session_remediation.py
      - name: v0.74 source-backed hydration regression
        run: python -m pytest -q tests/test_v074_sp16_b1_physical_hydration.py
      - name: v0.75 canonical Stage N7 regressions
        run: python -m pytest -q tests/test_v075_stage_n7_zy_contract.py tests/test_v075_report_metadata_overlay.py
      - name: v0.76 consolidated effective-length regression
        run: python -m pytest -q tests/test_v076_effective_length_card.py
      - name: v0.77 session replay and dark-header regression
        run: python -m pytest -q tests/test_v077_session_replay_dark_header.py
      - name: v0.78 explicit compression gamma_c regression
        run: python -m pytest -q tests/test_v078_gamma_c_compression.py
      - name: v0.79 retained-session guided-route regression
        run: python -m pytest -q tests/test_v079_retained_guided_route.py
      - name: v0.80 duplicate gamma and scalar-lambda cleanup regression
        run: python -m pytest -q tests/test_v080_guided_cleanup.py
      - name: v0.81 canonical stability handoff regression
        run: python -m pytest -q tests/test_v081_end_to_end_consistency.py
      - name: v0.82 guided-route regression
        run: python -m pytest -q tests/test_sp16_mech7_v082_full_guided_route_closure.py
      - name: v0.83 full guided end-to-end regression
        run: python -m pytest -q tests/test_v083_full_guided_e2e.py
      - name: v0.84 thermal visualization and FVM regression
        run: python -m pytest -q tests/test_v084_thermal_visualization.py
      - name: Re-run existing FIRE-UI regression
        run: python -m pytest -q tests/test_fire_ui1_frontend.py tests/test_fire_ui1_public_http.py
      - name: Boot real Streamlit server
        shell: bash
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/fire-streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/tmp/health.txt; then
              cat /tmp/health.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fire-streamlit.log
          exit 1
