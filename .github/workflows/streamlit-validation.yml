name: STREAMLIT-DEPLOY1 validation

on:
  push:
    branches:
      - 'feature/v0.68-streamlit-*'
      - 'feature/v0.69-streamlit-*'
      - 'feature/v0.69.*-streamlit-*'
      - 'feature/v0.70-*'
      - 'feature/v0.73-*'
      - 'feature/v0.74-*'
      - 'feature/v0.75-*'
      - 'feature/report-ir*'
    paths:
      - 'streamlit_app.py'
      - 'streamlit_app_core.py'
      - 'streamlit_guided_ux.py'
      - 'streamlit_guided_ux_v071.py'
      - 'streamlit_guided_ux_v072.py'
      - 'streamlit_guided_ux_v073.py'
      - 'streamlit_guided_ux_v074.py'
      - 'streamlit_guided_ux_v075.py'
      - 'streamlit_graphic_selectors.py'
      - 'streamlit_graphic_selectors_v072.py'
      - 'streamlit_mobile_ux.py'
      - 'streamlit_navigation.py'
      - 'streamlit_report_ui.py'
      - 'streamlit_report_ui_impl.py'
      - 'streamlit_report_summary.py'
      - 'standard_core/report_ir.py'
      - 'standard_core/report_ir2.py'
      - 'standard_core/report_ir4.py'
      - 'standard_core/report_ir5.py'
      - 'standard_core/report_equations.py'
      - 'standard_core/report_markdown.py'
      - 'standard_core/report_markdown_impl.py'
      - 'standard_core/report_readiness.py'
      - 'standard_core/report_metadata.py'
      - 'standard_core/**'
      - 'requirements.txt'
      - '.streamlit/**'
      - 'tests/test_streamlit_ui.py'
      - 'tests/test_streamlit_guided_ux.py'
      - 'tests/test_streamlit_mobile_ux.py'
      - 'tests/test_streamlit_navigation.py'
      - 'tests/test_report_tension_golden.py'
      - 'tests/test_v073_existing_session_remediation.py'
      - 'tests/test_v074_sp16_b1_physical_hydration.py'
      - 'tests/test_v075_stage_n7_zy_contract.py'
      - 'data/**'
      - 'normative_graph/**'
      - '.github/workflows/streamlit-validation.yml'
  pull_request:
    paths:
      - 'streamlit_app.py'
      - 'streamlit_app_core.py'
      - 'streamlit_guided_ux.py'
      - 'streamlit_guided_ux_v071.py'
      - 'streamlit_guided_ux_v072.py'
      - 'streamlit_guided_ux_v073.py'
      - 'streamlit_guided_ux_v074.py'
      - 'streamlit_guided_ux_v075.py'
      - 'streamlit_graphic_selectors.py'
      - 'streamlit_graphic_selectors_v072.py'
      - 'streamlit_mobile_ux.py'
      - 'streamlit_navigation.py'
      - 'streamlit_report_ui.py'
      - 'streamlit_report_ui_impl.py'
      - 'streamlit_report_summary.py'
      - 'standard_core/report_ir.py'
      - 'standard_core/report_ir2.py'
      - 'standard_core/report_ir4.py'
      - 'standard_core/report_ir5.py'
      - 'standard_core/report_equations.py'
      - 'standard_core/report_markdown.py'
      - 'standard_core/report_markdown_impl.py'
      - 'standard_core/report_readiness.py'
      - 'standard_core/report_metadata.py'
      - 'standard_core/**'
      - 'requirements.txt'
      - '.streamlit/**'
      - 'tests/test_streamlit_ui.py'
      - 'tests/test_streamlit_guided_ux.py'
      - 'tests/test_streamlit_mobile_ux.py'
      - 'tests/test_streamlit_navigation.py'
      - 'tests/test_report_tension_golden.py'
      - 'tests/test_v073_existing_session_remediation.py'
      - 'tests/test_v074_sp16_b1_physical_hydration.py'
      - 'tests/test_v075_stage_n7_zy_contract.py'
      - 'data/**'
      - 'normative_graph/**'
      - '.github/workflows/streamlit-validation.yml'
  workflow_dispatch:

jobs:
  streamlit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Streamlit presentation layers
        run: >-
          python -m py_compile
          streamlit_app.py
          streamlit_app_core.py
          streamlit_guided_ux.py
          streamlit_guided_ux_v071.py
          streamlit_guided_ux_v072.py
          streamlit_guided_ux_v073.py
          streamlit_guided_ux_v074.py
          streamlit_guided_ux_v075.py
          streamlit_graphic_selectors.py
          streamlit_graphic_selectors_v072.py
          streamlit_mobile_ux.py
          streamlit_navigation.py
          streamlit_report_ui.py
          streamlit_report_ui_impl.py
          streamlit_report_summary.py
          standard_core/sp16_mech7_v072_remediation.py
          standard_core/sp16_mech7_v073_session_remediation.py
          standard_core/sp16_mech7_v074_physical_remediation.py
          standard_core/sp16_mech7_v075_effective_length_contract.py
          standard_core/sp16_mech7_v075_zy_runtime.py
          standard_core/report_ir.py
          standard_core/report_ir2.py
          standard_core/report_ir4.py
          standard_core/report_ir5.py
          standard_core/report_equations.py
          standard_core/report_markdown.py
          standard_core/report_markdown_impl.py
          standard_core/report_readiness.py
          standard_core/report_metadata.py
      - name: Existing Streamlit UI
        id: existing_streamlit_ui
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_streamlit_ui.py > streamlit-ui-regression.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Upload Streamlit UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamlit-ui-regression
          path: streamlit-ui-regression.txt
      - name: Existing guided UX
        if: always()
        run: python -m pytest -q tests/test_streamlit_guided_ux.py
      - name: Existing mobile UX
        if: always()
        run: python -m pytest -q tests/test_streamlit_mobile_ux.py
      - name: Existing navigation
        if: always()
        run: python -m pytest -q tests/test_streamlit_navigation.py
      - name: Existing report golden
        if: always()
        run: python -m pytest -q tests/test_report_tension_golden.py
      - name: Existing v0.73 session remediation
        if: always()
        run: python -m pytest -q tests/test_v073_existing_session_remediation.py
      - name: Existing v0.74 physical hydration
        if: always()
        run: python -m pytest -q tests/test_v074_sp16_b1_physical_hydration.py
      - name: v0.75 graph insertion
        if: always()
        run: python -m pytest -q tests/test_v075_stage_n7_zy_contract.py::test_v075_active_graph_inserts_missing_length_and_restraint_cards_before_mech7_binder
      - name: v0.75 binder contract z-y only
        if: always()
        run: python -m pytest -q tests/test_v075_stage_n7_zy_contract.py::test_v075_binder_contract_uses_z_y_and_no_principal_x_alias
      - name: v0.75 Table 30 canonical state
        if: always()
        run: python -m pytest -q tests/test_v075_stage_n7_zy_contract.py::test_v075_table30_state_is_canonical_zy_and_lambda_bar_uses_design_Ry
      - name: v0.75 verified effective length basis
        if: always()
        run: python -m pytest -q tests/test_v075_stage_n7_zy_contract.py::test_v075_verified_effective_length_requires_basis_and_does_not_invent_mu
      - name: v0.75 no x transport aliases
        if: always()
        run: python -m pytest -q tests/test_v075_stage_n7_zy_contract.py::test_v075_registry_does_not_feed_principal_x_aliases_into_binder
      - name: v0.75 canonical compression binder
        if: always()
        run: python -m pytest -q tests/test_v075_stage_n7_zy_contract.py::test_v075_canonical_binder_reads_z_y_for_central_compression
      - name: v0.75 UI contract
        if: always()
        run: python -m pytest -q tests/test_v075_stage_n7_zy_contract.py::test_v075_ui_contract_hides_legacy_n7_axis_cards_and_exposes_new_zy_cards
      - name: Re-run existing FIRE-UI regression
        if: always()
        run: python -m pytest -q tests/test_fire_ui1_frontend.py tests/test_fire_ui1_public_http.py
      - name: Boot real Streamlit server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/fire-streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/tmp/health.txt; then
              cat /tmp/health.txt
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null
      - name: Enforce Streamlit UI regression result
        if: always()
        shell: bash
        run: test "${{ steps.existing_streamlit_ui.outputs.exit_code }}" = "0"
