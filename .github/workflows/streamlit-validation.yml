name: STREAMLIT-DEPLOY1 validation

on:
  push:
    branches:
      - 'feature/v0.68-streamlit-*'
      - 'feature/v0.69-streamlit-*'
    paths:
      - 'streamlit_app.py'
      - 'streamlit_app_core.py'
      - 'streamlit_graphic_selectors.py'
      - 'streamlit_mobile_ux.py'
      - 'requirements.txt'
      - '.streamlit/**'
      - 'tests/test_streamlit_ui.py'
      - 'tests/test_streamlit_mobile_ux.py'
      - 'standard_core/**'
      - 'data/**'
      - 'normative_graph/**'
      - '.github/workflows/streamlit-validation.yml'
  pull_request:
    paths:
      - 'streamlit_app.py'
      - 'streamlit_app_core.py'
      - 'streamlit_graphic_selectors.py'
      - 'streamlit_mobile_ux.py'
      - 'requirements.txt'
      - '.streamlit/**'
      - 'tests/test_streamlit_ui.py'
      - 'tests/test_streamlit_mobile_ux.py'
      - 'standard_core/**'
      - 'data/**'
      - 'normative_graph/**'
      - '.github/workflows/streamlit-validation.yml'
  workflow_dispatch:

jobs:
  streamlit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Streamlit presentation layers
        run: python -m py_compile streamlit_app.py streamlit_app_core.py streamlit_graphic_selectors.py streamlit_mobile_ux.py
      - name: Run Streamlit contract and UI smoke tests
        run: python -m pytest -q tests/test_streamlit_ui.py tests/test_streamlit_mobile_ux.py
      - name: Re-run existing FIRE-UI regression
        run: python -m pytest -q tests/test_fire_ui1_frontend.py tests/test_fire_ui1_public_http.py
      - name: Boot real Streamlit server
        shell: bash
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/fire-streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/tmp/health.txt; then
              cat /tmp/health.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fire-streamlit.log
          exit 1
