name: STREAMLIT-DEPLOY1 validation

on:
  push:
    branches:
      - 'feature/v0.75-*'
    paths:
      - '**'
  workflow_dispatch:

jobs:
  streamlit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile v0.75
        run: >-
          python -m py_compile
          streamlit_app.py
          streamlit_guided_ux_v075.py
          standard_core/sp16_mech7_v075_graph_overlay.py
          standard_core/sp16_mech7_v075_zy_runtime.py
      - name: Capture Streamlit UI smoke
        id: ui
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -vv tests/test_streamlit_ui.py > /tmp/v075-streamlit-ui.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/v075-streamlit-ui.txt
          exit $code
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v075-streamlit-ui-diagnostic
          path: /tmp/v075-streamlit-ui.txt
      - name: Run v0.75 focused regression
        if: always()
        run: python -m pytest -q tests/test_v075_stage_n7_zy_contract.py
      - name: Enforce UI smoke
        if: always()
        run: test "${{ steps.ui.outputs.exit_code }}" = "0"
