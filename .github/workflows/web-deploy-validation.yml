name: WEB-DEPLOY1 validation

on:
  push:
    branches:
      - feature/v0.68-web-deploy1
      - 'feature/report-ir*'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile public transport
        run: python -m compileall -q standard_core fire_ui1_web_service.py
      - name: Run FIRE-UI transport regression
        run: python -m pytest -q tests/test_fire_ui1_frontend.py tests/test_fire_ui1_public_http.py
