name: v0.110 net-property contract and guided regression

on:
  push:
    branches:
      - 'fix/v0110-inline-net-property-contract'
  pull_request:
    paths:
      - 'standard_core/fire_ui16_workflow.py'
      - 'standard_core/fire_ui14_manual_net_v092.py'
      - 'streamlit_guided_ux_v0106.py'
      - 'streamlit_weakening_route_v0109.py'
      - 'tests/test_v0109_weakening_atomic_route.py'
      - 'tests/test_v0110_net_property_contract.py'
      - '.github/workflows/v110-net-property-contract.yml'
  workflow_dispatch:

jobs:
  net-property-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile affected runtime, UI and tests
        run: |
          python -m py_compile \
            standard_core/fire_ui16_workflow.py \
            standard_core/fire_ui14_manual_net_v092.py \
            streamlit_guided_ux_v0106.py \
            streamlit_weakening_route_v0109.py \
            tests/test_v0109_weakening_atomic_route.py \
            tests/test_v0110_net_property_contract.py
      - name: Verify net properties and complete guided hole routes
        run: >-
          python -m pytest -q
          tests/test_v0110_net_property_contract.py
          tests/test_v0109_weakening_atomic_route.py
          tests/test_v092_manual_net_properties.py
          tests/test_fire_ui16_signed_load_parallel_scheduler.py
      - name: Import production Streamlit entrypoint
        run: python -c "import streamlit_app; print('streamlit_app import PASS')"
