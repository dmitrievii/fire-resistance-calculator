name: V085 validation

on:
  push:
    branches:
      - 'feature/v0.85-*'
  workflow_dispatch:

jobs:
  v085-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile v0.85 layers
        run: >-
          python -m py_compile
          streamlit_app.py
          streamlit_guided_ux_v085.py
          standard_core/fire_sp554_thermal_v085.py
          standard_core/sp16_mech7_v085_fvm_mesh_overlay.py
          standard_core/sp16_mech7_v085_fvm_runtime.py
      - name: v0.85 FVM mesh and gradient regression
        run: >-
          python -m pytest -q
          tests/test_v085_fvm_mesh_gradient.py
          tests/test_v084_thermal_visualization.py
          tests/test_fire_d3_sp554_thermal.py
          tests/test_fire_ui23_protection_route_closure.py
          tests/test_v083_full_guided_e2e.py
      - name: Existing FIRE-UI regression
        run: python -m pytest -q tests/test_fire_ui1_frontend.py tests/test_fire_ui1_public_http.py
      - name: Boot real Streamlit server
        shell: bash
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/fire-streamlit-v085.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/tmp/health-v085.txt; then
              cat /tmp/health-v085.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fire-streamlit-v085.log
          exit 1
