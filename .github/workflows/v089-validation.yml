name: V089 REPORT3 validation

on:
  push:
    branches:
      - 'feature/v0.89-*'
  workflow_dispatch:

jobs:
  expertise-narrative-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile REPORT3 layers
        run: >-
          python -W error::SyntaxWarning -m py_compile
          streamlit_app.py
          streamlit_live_report_v087.py
          streamlit_expertise_report_v088.py
          streamlit_expertise_report_v089.py
          standard_core/report_ir4.py
          standard_core/report_ir5.py
          standard_core/report_equations.py
      - name: v0.89 semantic expertise report regression
        run: >-
          python -m pytest -q
          tests/test_v089_expertise_narrative.py
          tests/test_v088_expertise_live_report.py
          tests/test_v087_live_report1.py
          tests/test_report_ir5.py
          tests/test_report_markdown.py
      - name: Retained guided and thermal UX regression
        run: >-
          python -m pytest -q
          tests/test_streamlit_ui.py
          tests/test_streamlit_guided_ux.py
          tests/test_streamlit_mobile_ux.py
          tests/test_v086_fvm_ux_search.py
          tests/test_v085_fvm_mesh_gradient.py
          tests/test_v084_thermal_visualization.py
      - name: Existing FIRE-UI regression
        run: python -m pytest -q tests/test_fire_ui1_frontend.py tests/test_fire_ui1_public_http.py tests/test_v083_full_guided_e2e.py
      - name: Boot real Streamlit server
        shell: bash
        run: |
          set -euo pipefail
          streamlit run streamlit_app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/fire-streamlit-v089.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/tmp/health-v089.txt; then
              cat /tmp/health-v089.txt
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fire-streamlit-v089.log
          exit 1
