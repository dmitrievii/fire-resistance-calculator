name: REPORT-IR validation

on:
  push:
    branches:
      - 'feature/report-ir*'
    paths:
      - 'standard_core/__init__.py'
      - 'standard_core/declarative_runtime_evidence.py'
      - 'standard_core/declarative_case_evidence.py'
      - 'standard_core/report_ir.py'
      - 'standard_core/report_ir2.py'
      - 'standard_core/report_ir4.py'
      - 'standard_core/report_ir5.py'
      - 'standard_core/report_equations.py'
      - 'standard_core/report_markdown.py'
      - 'standard_core/report_readiness.py'
      - 'standard_core/report_metadata.py'
      - 'normative_graph/report_metadata_v0.3.71_report_meta1.json'
      - 'normative_graph/report_metadata_v0.3.72_tension_golden.json'
      - 'tools/export_report_readiness.py'
      - 'tools/export_governing_candidates.py'
      - 'tools/export_tension_report_route.py'
      - 'tools/export_tension_golden_contract.py'
      - 'tools/audit_tension_gamma_ct.py'
      - 'streamlit_report_ui.py'
      - 'streamlit_report_summary.py'
      - 'streamlit_app.py'
      - 'schemas/fire_report_ir_v1.schema.json'
      - 'schemas/fire_report_ir_v2.schema.json'
      - 'schemas/fire_report_ir_v3.schema.json'
      - 'schemas/fire_report_ir_v4.schema.json'
      - 'tests/test_report_ir.py'
      - 'tests/test_report_ir2.py'
      - 'tests/test_report_ir4.py'
      - 'tests/test_report_ir5.py'
      - 'tests/test_report_markdown.py'
      - 'tests/test_report_readiness.py'
      - 'tests/test_report_metadata.py'
      - 'tests/test_report_tension_golden.py'
      - '.github/workflows/report-ir-validation.yml'
  pull_request:
    paths:
      - 'standard_core/__init__.py'
      - 'standard_core/declarative_runtime_evidence.py'
      - 'standard_core/declarative_case_evidence.py'
      - 'standard_core/report_ir.py'
      - 'standard_core/report_ir2.py'
      - 'standard_core/report_ir4.py'
      - 'standard_core/report_ir5.py'
      - 'standard_core/report_equations.py'
      - 'standard_core/report_markdown.py'
      - 'standard_core/report_readiness.py'
      - 'standard_core/report_metadata.py'
      - 'normative_graph/report_metadata_v0.3.71_report_meta1.json'
      - 'normative_graph/report_metadata_v0.3.72_tension_golden.json'
      - 'tools/export_report_readiness.py'
      - 'tools/export_governing_candidates.py'
      - 'tools/export_tension_report_route.py'
      - 'tools/export_tension_golden_contract.py'
      - 'tools/audit_tension_gamma_ct.py'
      - 'streamlit_report_ui.py'
      - 'streamlit_report_summary.py'
      - 'streamlit_app.py'
      - 'schemas/fire_report_ir_v1.schema.json'
      - 'schemas/fire_report_ir_v2.schema.json'
      - 'schemas/fire_report_ir_v3.schema.json'
      - 'schemas/fire_report_ir_v4.schema.json'
      - 'tests/test_report_ir.py'
      - 'tests/test_report_ir2.py'
      - 'tests/test_report_ir4.py'
      - 'tests/test_report_ir5.py'
      - 'tests/test_report_markdown.py'
      - 'tests/test_report_readiness.py'
      - 'tests/test_report_metadata.py'
      - 'tests/test_report_tension_golden.py'
      - '.github/workflows/report-ir-validation.yml'
  workflow_dispatch:

jobs:
  report-ir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema
      - name: Compile report runtime
        run: |
          python -m py_compile \
            standard_core/declarative_runtime_evidence.py \
            standard_core/declarative_case_evidence.py \
            standard_core/report_ir.py \
            standard_core/report_ir2.py \
            standard_core/report_ir4.py \
            standard_core/report_ir5.py \
            standard_core/report_equations.py \
            standard_core/report_markdown.py \
            standard_core/report_readiness.py \
            standard_core/report_metadata.py \
            tools/export_report_readiness.py \
            tools/export_governing_candidates.py \
            tools/export_tension_report_route.py \
            tools/export_tension_golden_contract.py \
            tools/audit_tension_gamma_ct.py \
            streamlit_report_ui.py \
            streamlit_report_summary.py \
            streamlit_app.py
      - name: Run REPORT-IR focused regression
        run: >-
          python -m pytest -q
          tests/test_report_ir.py
          tests/test_report_ir2.py
          tests/test_report_ir4.py
          tests/test_report_ir5.py
          tests/test_report_markdown.py
          tests/test_report_readiness.py
          tests/test_report_metadata.py
          tests/test_report_tension_golden.py
      - name: Export active-DAG readiness census
        run: python -m tools.export_report_readiness
      - name: Export active-DAG governing candidates
        run: python -m tools.export_governing_candidates
      - name: Export central-tension report route census
        run: python -m tools.export_tension_report_route
      - name: Export exact central-tension golden contract
        run: python -m tools.export_tension_golden_contract
      - name: Audit gamma_ct semantics in central tension
        run: python -m tools.audit_tension_gamma_ct
      - name: Upload active-DAG report audits
        uses: actions/upload-artifact@v4
        with:
          name: report-audits-active-dag
          path: |
            artifacts/report_readiness_active_dag.json
            artifacts/governing_candidates_active_dag.json
            artifacts/tension_report_route_active_dag.json
            artifacts/tension_golden_contract_active_dag.json
            artifacts/tension_gamma_ct_audit.json
          if-no-files-found: error
      - name: Validate REPORT-IR schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          for name in (
              'fire_report_ir_v1.schema.json',
              'fire_report_ir_v2.schema.json',
              'fire_report_ir_v3.schema.json',
              'fire_report_ir_v4.schema.json',
          ):
              schema = json.loads((Path('schemas') / name).read_text(encoding='utf-8'))
              cls = validator_for(schema)
              cls.check_schema(schema)
              print(name, 'PASS')
          PY
