name: v0.92 ambient-fire stability separation

on:
  push:
    branches:
      - 'fix/v0.92-runtime-report-remediation'
    paths:
      - 'standard_core/fire_sp554_runtime_v091.py'
      - 'standard_core/fire_sp554_runtime_v092.py'
      - 'standard_core/sp16_mech7_v075_zy_runtime.py'
      - 'streamlit_expertise_report_v091.py'
      - 'streamlit_expertise_report_v090_thermal_refinement.py'
      - 'tests/test_v092_ambient_fire_phi_separation.py'
      - '.github/workflows/v092-ambient-fire-stability-separation.yml'
  pull_request:
    paths:
      - 'standard_core/fire_sp554_runtime_v091.py'
      - 'standard_core/fire_sp554_runtime_v092.py'
      - 'standard_core/sp16_mech7_v075_zy_runtime.py'
      - 'streamlit_expertise_report_v091.py'
      - 'streamlit_expertise_report_v090_thermal_refinement.py'
      - 'tests/test_v092_ambient_fire_phi_separation.py'
      - '.github/workflows/v092-ambient-fire-stability-separation.yml'
  workflow_dispatch:

jobs:
  ambient-fire-stability-separation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile stability runtime and report layers
        run: |
          python -m py_compile \
            standard_core/fire_sp554_runtime_v091.py \
            standard_core/fire_sp554_runtime_v092.py \
            standard_core/sp16_mech7_v075_zy_runtime.py \
            streamlit_expertise_report_v091.py \
            streamlit_expertise_report_v090_thermal_refinement.py
      - name: Ambient versus fire phi separation regression
        run: python -m pytest -q tests/test_v092_ambient_fire_phi_separation.py
